<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your Elevate account</title>
  </head>
  <!--
    Elevate Auth — Confirm signup
    Paste into Supabase Dashboard → Authentication → Email Templates → Confirm signup

    SSR-safe link (required for Next.js App Router):
    Use TokenHash + type against /auth/callback so the server can verifyOtp.
    Do NOT use ConfirmationURL alone — GoTrue currently returns implicit
    #access_token hashes that never reach a Route Handler.
  -->
  <body style="margin:0;padding:0;background:#f6faf9;font-family:Arial,sans-serif;">
    <span style="display:none !important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden;">Confirm your Elevate Health Solutions account.</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6faf9;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #d8e8e4;">
            <tr>
              <td style="background:#1f3a43;padding:20px 24px;">
                <p style="margin:0;color:#ffffff;font-size:18px;font-weight:700;">Elevate Health Solutions</p>
                <p style="margin:4px 0 0;color:#d8e8e4;font-size:13px;">Science + soul</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 18px;">
                <h1 style="margin:0 0 12px;color:#1f3a43;font-size:24px;line-height:1.25;">Confirm your email</h1>
                <p style="margin:0 0 16px;color:#1f3a43;line-height:1.6;">
                  Welcome to Elevate. Confirm your email to finish creating your account.
                </p>
                <p style="margin:20px 0 28px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/dashboard" style="display:inline-block;background:#2f7e96;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;">Confirm email</a>
                </p>
                <p style="margin:0;color:#46616a;font-size:13px;line-height:1.5;">
                  If you did not create an Elevate account, you can ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
